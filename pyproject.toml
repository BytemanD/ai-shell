[project]
name = "ai-shell"
dynamic = ["version"]
description = "AI Shell - A shell for AI"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"
keywords = ["ai", "shell", "cli", "llm", "command", "terminal"]
authors = [{ name = "BytemanD", email = "byteman.d@outlook.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Shells",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.3.1",
    "pystonic[agent,orm,pretty]>=2.0.4",
    "textual>=8.2.8",
]

[project.scripts]
aishell = "ai_shell.cmd.aishell:main"

[dependency-groups]
dev = ["pytest>=9.0.2", "ruff>=0.15.6"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_shell"]

[[tool.uv.index]]
name = "tencent"
url = "http://mirrors.cloud.tencent.com/pypi/simple"

